<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledge Map</title>
  <style>
    :root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101516;color:#e9efeb}
    *{box-sizing:border-box}body{margin:0;overflow:hidden}.toolbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#192120;border-bottom:1px solid #35403d;position:relative;z-index:2}
    .brand{font-weight:750;letter-spacing:.04em;margin-right:10px;color:#a7dbbb}select,button{font:inherit;color:inherit;background:#25302d;border:1px solid #43504b;border-radius:8px;padding:7px 10px}button{cursor:pointer}button:hover,select:hover{background:#303d39}
    #world{min-width:210px}.spacer{flex:1}.status{color:#a5b2ac;font-size:12px}#viewport{height:calc(100vh - 56px);display:grid;place-items:center;overflow:hidden;background-color:#17201e;background-image:linear-gradient(45deg,#202a27 25%,transparent 25%),linear-gradient(-45deg,#202a27 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202a27 75%),linear-gradient(-45deg,transparent 75%,#202a27 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    canvas{width:100%;height:100%;cursor:grab;transform-origin:center;transition:transform .18s ease;image-rendering:pixelated}canvas.dragging{cursor:grabbing}.controls{position:absolute;right:18px;top:74px;display:grid;gap:7px;z-index:1}.controls button{width:38px;height:38px;font-size:18px;padding:0}.help{position:absolute;bottom:14px;left:16px;background:#101715c9;border:1px solid #43504b;border-radius:8px;padding:8px 11px;color:#c3cec8;font-size:12px;pointer-events:none}
    @media(max-width:700px){.toolbar{gap:6px;padding:0 8px}.brand{display:none}#world{min-width:140px}.status{display:none}}
  </style>
</head>
<body>
  <header class="toolbar"><div class="brand">LEDGE</div><select id="world" aria-label="World"></select><select id="renderer" aria-label="Renderer"><option value="SURFACE">Surface</option><option value="FLAT">Flat</option><option value="CAVE">Caves</option></select><select id="resolution" aria-label="Resolution"><option value="LOW">Low</option><option value="STANDARD">Standard</option><option value="HIGH">High</option><option value="ULTRA">Ultra</option></select><button id="projection">2D</button><label><input id="players" type="checkbox" checked> Players</label><div class="spacer"></div><span id="status" class="status">Connecting…</span></header>
  <main id="viewport"><canvas id="map"></canvas><div class="controls"><button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">−</button><button id="center" title="Center">⌖</button></div><div class="help">Drag to pan · Scroll to zoom · Updates automatically</div></main>
  <script>
    const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),worldSelect=document.querySelector('#world'),rendererSelect=document.querySelector('#renderer'),resolutionSelect=document.querySelector('#resolution'),status=document.querySelector('#status');
    let world=null,cameraX=0,cameraZ=0,scale=1,projection3d=false,players=[],lastTiles=new Map(),drag=null;
    function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(canvas.clientWidth*dpr);canvas.height=Math.floor(canvas.clientHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
    async function loadWorlds(){const worlds=await fetch('/api/worlds',{cache:'no-store'}).then(r=>r.json());worldSelect.replaceChildren(...worlds.map((w,i)=>{const o=document.createElement('option');o.value=JSON.stringify(w);o.textContent=w.label;if(i===0)world=w;return o}));if(world){worldSelect.value=JSON.stringify(world);cameraX=world.x;cameraZ=world.z;rendererSelect.value=world.renderer;resolutionSelect.value=world.resolution}draw()}
    function tileSpan(){return 256/({LOW:2,STANDARD:4,HIGH:8,ULTRA:16}[resolutionSelect.value]||4)*(1<<Math.max(0,zoomLevel()))}
    function zoomLevel(){return Math.max(0,Math.min(12,Math.round(-Math.log2(scale))))}
    function tileUrl(tx,tz,path='tiles'){const q=new URLSearchParams({world:world.world,dimension:world.dimension,renderer:rendererSelect.value,resolution:resolutionSelect.value,zoom:String(zoomLevel()),x:String(tx),z:String(tz)});return '/'+path+'?'+q.toString()}
    function prepareProjected(entry){if(!entry.loaded||!entry.heights||entry.projected||rendererSelect.value!=='SURFACE')return;const step=256/({LOW:2,STANDARD:4,HIGH:8,ULTRA:16}[resolutionSelect.value]||4),zoom=zoomLevel(),vertical=step/(4*(1<<zoom)),source=document.createElement('canvas');source.width=source.height=256;const sourceContext=source.getContext('2d',{willReadFrequently:true});sourceContext.drawImage(entry.image,0,0);const colors=sourceContext.getImageData(0,0,256,256).data;let min=32767,max=-32768;for(let i=0;i<entry.heights.length;i++){min=Math.min(min,entry.heights[i]);max=Math.max(max,entry.heights[i])}const output=document.createElement('canvas');output.width=256;output.height=Math.ceil(128+(max-min)*vertical)+2;const out=output.getContext('2d');const samples=256/step,baseY=(max-64)*vertical;const point=(u,v,h)=>[128+(u-v)/2,(u+v)/4+(max-h)*vertical];const polygon=(points,color)=>{out.fillStyle=color;out.beginPath();out.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)out.lineTo(points[i][0],points[i][1]);out.closePath();out.fill()};const colorAt=(x,z)=>{const i=((z*step+step/2|0)*256+(x*step+step/2|0))*4;return [colors[i],colors[i+1],colors[i+2],colors[i+3]]};const heightAt=(x,z)=>entry.heights[(z*step+step/2|0)*256+(x*step+step/2|0)];const neighbor=(x,z)=>{if(x<samples)return heightAt(x,z);const next=lastTiles.get((entry.tx+1)+','+entry.tz);return next?.heights?next.heights[(z*step+step/2|0)*256+step/2|0]:heightAt(samples-1,z)};const southNeighbor=(x,z)=>{if(z<samples)return heightAt(x,z);const next=lastTiles.get(entry.tx+','+(entry.tz+1));return next?.heights?next.heights[(step/2|0)*256+(x*step+step/2|0)]:heightAt(x,samples-1)};for(let depth=0;depth<samples*2-1;depth++)for(let z=Math.max(0,depth-samples+1);z<=Math.min(samples-1,depth);z++){const x=depth-z,h=heightAt(x,z),c=colorAt(x,z);if(c[3]===0)continue;const u=x*step,v=z*step,A=point(u,v,h),B=point(u+step,v,h),C=point(u+step,v+step,h),D=point(u,v+step,h),rgb=`rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`;const east=neighbor(x+1,z);if(h>east){const Eb=point(u+step,v,east),Ec=point(u+step,v+step,east);polygon([B,C,Ec,Eb],`rgba(${Math.round(c[0]*.58)},${Math.round(c[1]*.58)},${Math.round(c[2]*.58)},${c[3]/255})`)}const south=southNeighbor(x,z+1);if(h>south){const Sd=point(u,v+step,south),Sc=point(u+step,v+step,south);polygon([D,C,Sc,Sd],`rgba(${Math.round(c[0]*.42)},${Math.round(c[1]*.42)},${Math.round(c[2]*.42)},${c[3]/255})`)}polygon([A,B,C,D],rgb)}entry.projected=output;entry.vertical=vertical;entry.maxHeight=max;entry.baseY=baseY;draw()}
    async function loadHeights(entry){if(entry.heightLoading||entry.heights||!projection3d||rendererSelect.value!=='SURFACE')return;entry.heightLoading=true;try{const response=await fetch(tileUrl(entry.tx,entry.tz,'heights'),{cache:'no-store'});if(response.status===202){entry.heightRetry=Date.now()+800;setTimeout(()=>{entry.heightLoading=false;draw()},800);return}if(!response.ok)throw new Error('height tile unavailable');const bytes=await response.arrayBuffer(),view=new DataView(bytes);if(bytes.byteLength!==131080||view.getUint32(0,false)!==0x4c444748||view.getUint16(4,false)!==1||view.getUint16(6,false)!==256)throw new Error('invalid height tile');const heights=new Int16Array(65536);for(let i=0;i<heights.length;i++)heights[i]=view.getInt16(8+i*2,false);entry.heights=heights;prepareProjected(entry);for(const key of [(entry.tx-1)+','+entry.tz,(entry.tx+1)+','+entry.tz,entry.tx+','+(entry.tz-1),entry.tx+','+(entry.tz+1)]){const neighbor=lastTiles.get(key);if(neighbor?.loaded&&neighbor.heights){neighbor.projected=null;prepareProjected(neighbor)}}}catch{entry.heightRetry=Date.now()+5000;setTimeout(()=>{entry.heightLoading=false;draw()},5000)}finally{if(entry.heights)entry.heightLoading=false}}
    function draw(){if(!ctx||!canvas.width)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=canvas.width/w;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);if(!world)return;
      const span=tileSpan(),tilePx=256*scale,cx=Math.floor(cameraX/span),cz=Math.floor(cameraZ/span),offsetX=(cameraX-cx*span)/span*tilePx,offsetZ=(cameraZ-cz*span)/span*tilePx;
      const drawTile=(dx,dz)=>{
        const tx=cx+dx,tz=cz+dz,key=tx+','+tz;
        const px=projection3d?w/2+((dx*tilePx-offsetX)-(dz*tilePx-offsetZ))/2:w/2+dx*tilePx-offsetX;
        const pz=projection3d?h/2+((dx*tilePx-offsetX)+(dz*tilePx-offsetZ))/4:h/2+dz*tilePx-offsetZ;
        if(projection3d&&(px+tilePx/2<0||px-tilePx/2>w||pz+tilePx/2<0||pz>h))return;
        let entry=lastTiles.get(key);if(!entry){entry={tx,tz,image:new Image(),loading:false,loaded:false,retryAt:0};lastTiles.set(key,entry)}
        if(!entry.loading&&!entry.loaded&&Date.now()>=entry.retryAt){entry.loading=true;entry.image.onload=()=>{entry.loading=false;entry.loaded=true;prepareProjected(entry);draw()};entry.image.onerror=async()=>{entry.loading=false;const response=await fetch(tileUrl(tx,tz),{cache:'no-store'});if(response.status===202){status.textContent='Rendering tiles…';entry.retryAt=Date.now()+800}else if(response.ok){entry.image.src=tileUrl(tx,tz)+'&v='+Date.now();return}else{status.textContent='Map tile unavailable';entry.retryAt=Date.now()+5000}setTimeout(draw,Math.max(10,entry.retryAt-Date.now()))};entry.image.src=tileUrl(tx,tz)+'&v='+Date.now()}
        if(projection3d)loadHeights(entry);
        if(projection3d)prepareProjected(entry);
        if(entry.loaded){if(projection3d&&entry.projected){ctx.drawImage(entry.projected,px-128*scale,pz-entry.baseY*scale,tilePx,entry.projected.height*scale)}else if(projection3d){ctx.save();ctx.setTransform(dpr*scale/2,dpr*scale/4,-dpr*scale/2,dpr*scale/4,dpr*px,dpr*pz);ctx.drawImage(entry.image,0,0,256,256);ctx.restore()}else ctx.drawImage(entry.image,px,pz,tilePx,tilePx)}
      };
      if(projection3d){const xRange=Math.ceil(w/tilePx)+2,yRange=Math.ceil(2*h/tilePx)+2,tiles=[];for(let p=-xRange;p<=xRange;p++)for(let q=-yRange;q<=yRange;q++){if((p+q)%2===0)tiles.push({dx:(p+q)/2,dz:(q-p)/2})}tiles.sort((a,b)=>a.dx+a.dz-b.dx-b.dz);for(const tile of tiles)drawTile(tile.dx,tile.dz)}
      else{const radius=Math.ceil(Math.max(w,h)/tilePx/2)+1;for(let dz=-radius;dz<=radius;dz++)for(let dx=-radius;dx<=radius;dx++)drawTile(dx,dz)}
      if(document.querySelector('#players').checked)for(const p of players){if(p.world!==world.world||p.dimension!==world.dimension)continue;const dx=(p.x-cameraX)*tilePx/span,dz=(p.z-cameraZ)*tilePx/span,px=projection3d?w/2+(dx-dz)/2:w/2+dx;let pz=projection3d?h/2+(dx+dz)/4:h/2+dz;if(projection3d&&rendererSelect.value==='SURFACE'){const tx=Math.floor(p.x/span),tz=Math.floor(p.z/span),entry=lastTiles.get(tx+','+tz);if(entry?.heights){const sx=Math.max(0,Math.min(255,Math.floor((p.x-tx*span)/span*256))),sz=Math.max(0,Math.min(255,Math.floor((p.z-tz*span)/span*256)));pz-=(entry.heights[sz*256+sx]-64)*tilePx/span/4}}if(px>-30&&pz>-30&&px<w+30&&pz<h+30){ctx.fillStyle='#f3c76b';ctx.beginPath();ctx.arc(px,pz,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(p.name,px+8,pz+4)}}
      status.textContent=`${world.label} · ${rendererSelect.value} · ${resolutionSelect.value} · ${Math.round(scale*100)}%`
    }
    function setWorld(){world=JSON.parse(worldSelect.value);cameraX=world.x;cameraZ=world.z;lastTiles.clear();draw()}
    worldSelect.addEventListener('change',setWorld);for(const el of [rendererSelect,resolutionSelect])el.addEventListener('change',()=>{lastTiles.clear();draw()});
    document.querySelector('#projection').addEventListener('click',e=>{projection3d=!projection3d;e.currentTarget.textContent=projection3d?'3D':'2D';draw()});
    document.querySelector('#zoomIn').onclick=()=>zoomAt(scale*1.35);document.querySelector('#zoomOut').onclick=()=>zoomAt(scale/1.35);document.querySelector('#center').onclick=()=>{cameraX=world.x;cameraZ=world.z;draw()};
    function zoomAt(next){scale=Math.max(.125,Math.min(4,next));lastTiles.clear();draw()}
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale*(e.deltaY<0?1.15:1/1.15))},{passive:false});
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,z:e.clientY,cx:cameraX,cz:cameraZ};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;const span=tileSpan(),pixelsPerBlock=256*scale/span,dx=e.clientX-drag.x,dz=e.clientY-drag.z;if(projection3d){cameraX=drag.cx-(dx+2*dz)/pixelsPerBlock;cameraZ=drag.cz-(-dx+2*dz)/pixelsPerBlock}else{cameraX=drag.cx-dx/pixelsPerBlock;cameraZ=drag.cz-dz/pixelsPerBlock}draw()});
    canvas.addEventListener('pointerup',()=>{drag=null;canvas.classList.remove('dragging')});
    async function refreshPlayers(){try{players=await fetch('/api/players',{cache:'no-store'}).then(r=>r.json());draw()}catch{}}
    async function refreshTiles(){lastTiles.clear();draw();refreshPlayers()}
    new ResizeObserver(resize).observe(canvas);loadWorlds().then(()=>{resize();refreshPlayers()});setInterval(refreshTiles,2500);setInterval(refreshPlayers,2500);
  </script>
</body>
</html>
