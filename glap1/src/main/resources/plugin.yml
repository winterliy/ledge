name: Ledge
version: '${version}'
main: dev.ledge.glap1.LedgeGlap1Plugin
api-version: '1.21'
description: GLAP1 server adapter for Ledge.
commands:
  ledge:
    description: Manage Ledge map rendering and terrain pre-generation.
    usage: /ledge pregen <start|pause|continue|cancel|status> [world] [radius] [square|circle] [centerX centerZ]
    permission: ledge.admin
permissions:
  ledge.admin:
    description: Manage Ledge map rendering and pre-generation.
    default: op
