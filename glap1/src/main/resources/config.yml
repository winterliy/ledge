web:
  enabled: true
  host: 127.0.0.1
  port: 8123
  allow-external: false
render:
  max-samples-per-tick: 2048
  workers: 1
  # Chunk snapshots requested at once (taken on the main thread on Paper, on region threads on Folia).
  snapshots-in-flight: 64
  disk-chunks:
    # Read already generated but unloaded chunks from disk for map tiles (never generates terrain).
    enabled: true
    per-tile: 256
    in-flight: 32
    # Stop reading extra chunks while the average tick takes longer than this (ms). 0 disables the check.
    pause-above-mspt: 40.0
defaults:
  renderer: SURFACE
  resolution: STANDARD
  live-updates: true
worlds: {}
