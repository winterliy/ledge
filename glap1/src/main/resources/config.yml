web:
  enabled: true
  host: 127.0.0.1
  port: 8123
  allow-external: false
render:
  max-samples-per-tick: 2048
  # Region workers for composing tiles off the server thread; 0 = number of CPU cores minus 2 (at least 2).
  workers: 0
  # Chunk snapshots requested at once (taken on the main thread on Paper, on region threads on Folia).
  snapshots-in-flight: 64
  disk-chunks:
    # Draw unloaded but generated chunks by reading region files on the region workers (no server-thread cost).
    enabled: true
defaults:
  renderer: SURFACE
  resolution: STANDARD
  live-updates: true
worlds: {}
